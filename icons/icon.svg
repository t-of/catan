<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sea" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#22768a"/>
      <stop offset="0.55" stop-color="#14495b"/>
      <stop offset="1" stop-color="#0b2a38"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fa75c"/>
      <stop offset="1" stop-color="#2c6e3f"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#sea)"/>

  <g transform="translate(16 28) scale(0.92)">
  <!-- 奥のタイル（島が複数タイルでできていることを示す） -->
  <polygon points="235,160 187.5,242.3 92.5,242.3 45,160 92.5,77.7 187.5,77.7"
    fill="#c0643a" stroke="#7a3c22" stroke-width="6"/>

  <!-- 手前の六角タイル -->
  <polygon points="406,270 331,399.9 181,399.9 106,270 181,140.1 331,140.1"
    fill="url(#wood)" stroke="#1d4a2a" stroke-width="10" stroke-linejoin="round"/>

  <!-- 資源の目 -->
  <circle cx="226" cy="300" r="9" fill="#efe7d6" opacity="0.55"/>
  <circle cx="256" cy="300" r="9" fill="#efe7d6" opacity="0.55"/>
  <circle cx="286" cy="300" r="9" fill="#efe7d6" opacity="0.55"/>

  <!-- 道 -->
  <line x1="331" y1="206" x2="398" y2="258" stroke="#e6b85c" stroke-width="24" stroke-linecap="round"/>

  <!-- 開拓地（家） -->
  <polygon points="331,96 381,142 281,142" fill="#e6b85c"/>
  <rect x="291" y="142" width="80" height="62" fill="#efe7d6" stroke="#1a1420" stroke-width="6"/>
  <rect x="320" y="168" width="22" height="36" fill="#1a1420"/>
  </g>
</svg>
